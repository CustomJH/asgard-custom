[project]
name = "asgard"
description = "Asgard — make anything, your way. curl-installable CLI."
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "textual>=0.60",  # full-screen onboarding TUI (asgard init); pure-python, builds on rich
    "anthropic>=0.60",
    "openai>=1.40",
    "httpx>=0.27",  # Asgard-owned OAuth device flow + refresh for subscription providers
    "claude-agent-sdk>=0.2",  # claude-native provider — 로컬 claude CLI 구동 (claude_cli 트랜스포트)
    "prompt-toolkit>=3.0",
    "pypdf>=6.14.2",  # native PDF text extraction
    "python-hwpx>=3.5.0",  # HWPX parsing/editing for the bundled Korean document skill
    # Office 계층(Sága) — 순수 파이썬 OOXML. LibreOffice·pandoc 없이도 생성/읽기/검증이 서야
    # `uv tool install asgard` 한 줄로 끝나는 설치 약속이 유지된다. 렌더는 별도 외부 관문.
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0.3",  # built-in DESIGN.md Python linter
    "coloraide>=8.10",  # CSS color parsing + WCAG contrast for DESIGN.md
    # 시맨틱 검색 (1차 메모리 3번째 RRF 스트림) — torch 무의존 정적 임베더.
    # 26-07-27 실측으로 기본 의존성으로 승격: 켜면 hit@1 0.750→0.850, 놓친 질의 11→2건, 회귀 0.
    # 한국어가 걸린 결정이다 — 작은 정적 모델(potion-base-8M 등)은 한국어 판별력이 음수라
    # (관련 문장보다 무관 문장을 더 가깝다고 본다) 다국어 모델 외엔 선택지가 없었다.
    "model2vec>=0.8",
]

# 남겨 두는 별칭 — 구 설치 스크립트의 `asgard[semantic]` 를 깨지 않는다 (이제 기본 포함).
[project.optional-dependencies]
semantic = []

# curl|bash install path: `uv tool install asgard` exposes this console script.
[project.scripts]
asgard = "asgard.cli:main"

# 개발 도구 (PEP 735) — `uv sync` 기본 포함, 배포 wheel 에는 안 들어감.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",  # 커버리지 가시화 — 게이트 아님, 공백이 파이프라인에 보이게만 (CI --cov)
    # 스위트 병렬 실행. 26-08-06 부터 `[tool.pytest.ini_options]` 의 addopts 로 **기본**이다
    # (근거와 끄는 법은 그 줄에). 밀폐 픽스처는 프로세스 단위라 워커 격리가 이미 서 있다
    # (tests/conftest.py 의 session 스코프 `_hermetic_studio_state` 는 xdist 워커마다 따로 도는
    # 별개 프로세스에서 각자 잡힌다).
    "pytest-xdist>=3.6",
    # `--timeout` 을 준다. 퀘스트 criteria 의 verify 계약이 이 플래그로 스위트 상한을 적는데,
    # 없으면 그 명령이 `unrecognized arguments` 로 exit 4 를 내고 계약이 영영 미충족으로 남는다.
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "ty>=0.0.56",
    "model2vec>=0.8",  # 시맨틱 스트림 dev 실검증·벤치용 — 배포 기본엔 불포함 (extra: semantic)
]

# 구조 현대화 뼈대 — lint·format 은 ruff 로 통일.
[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [
    "src/asgard/assets/skill_plugins/**",  # vendored resource snapshots retain upstream bytes
    "archive/**",  # 보존용 원문 스냅샷 — 린트 대상 아님
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle · pyflakes · isort — 최소 셋부터
ignore = ["E501"]  # 포매터 병용 시 공식 권장 — 장문 템플릿 문자열은 포매터도 못 접음

[tool.pytest.ini_options]
testpaths = ["tests"]
# 병렬이 기본이다. 26-08-06 실측: 직렬 898초 · 병렬 196초.
# 대가는 한 파일만 돌릴 때의 워커 기동 +1.2초(0.48→1.67초)이고, 그 자리에서는 `-n0` 로 끈다.
# 그 손잡이가 있으니 기본값은 흔한 쪽이 아니라 **긴 쪽**을 맞춘다 — 커밋 전 전수 실행은
# 15분이면 사람이 건너뛰지만 3분이면 돌린다.
#
# 알려진 대가 하나 — 코어를 다 물면 시간을 재는 시험들이 자기 차례를 못 받아 실행마다 **다른**
# 한 건이 빨개진다 (26-08-06: 네 번 돌려 sqlite·siege·wave 가 번갈아 한 건씩; 각각 단독으로는
# 6회 연속 통과). 그중 하나는 진짜 결함이었고 고쳤다(`io_sqlite.writing`). 남은 것들은 굶주림
# 쪽이고, 아직 어느 시험이 얼마나 굶으면 깨지는지 재지 않았다 — 그걸 재기 전에는 워커 수를
# 임의로 낮추지 않는다. 초록을 신호로 되돌리는 일이 이 설정의 다음 몫이다.
addopts = ["-n", "auto"]

# ── health 게이트 기준선 — `uv run python -m asgard.commands.health --gate` 가 읽는 정본 ──
# 왜 여덟 지표 중 이 둘만 막는지, 왜 기준선이 커밋·태그가 아니라 이 파일에 있는지는
# src/asgard/health.py 의 GATE_METRICS·GATE_TABLE 주석에 있다.
#
# 실측 기준선: 트리 전수 스캔 — severe_files 0 · cycles 0 (26-08-06).
# 이 수는 목표가 아니라 **상한**이다. 내려가는 것은 언제든 환영이고(내려도 게이트는 조용하다),
# 올리는 커밋은 "왜 1000행을 넘겨야 했는가"를 같이 들고 와야 한다 — 그 대화가 이 파일에
# 기준선을 둔 이유다.
#
# 26-08-06 이전에는 2였고 그 둘은 훅이었다 (`hooks/quest_log.py` 3,764줄 · `hooks/verifier_gate.py`
# 1,318줄). 예외의 근거는 배포 계약이었다 — `script()` 가 파일 **하나**를 사용자 저장소에 쓰므로
# 모듈로 가르면 스캐폴딩이 깰 파일을 못 찾는다. 그래서 계약을 먼저 바꿨다: 공용 라이브러리
# (`hooks/asgard_hooklib/`)가 훅과 **같은 폴더에** 함께 깔린다. 배포본은 여전히 asgard 를 임포트
# 하지 않고, 훅 셋에 사본으로 살던 판정 기반은 한 자리로 모였다 (그 사본들은 이미 갈라져 있었다).
[tool.asgard.health-gate]
severe_files = 0
cycles = 0

# ── craft 형상 예산 — `asgard craft` 와 `asgard health` 가 함께 읽는 함수 문턱 ──
# 값의 근거는 src/asgard/health.py 의 `UNIT_LINES_WARN`·`DEPTH_WARN` 주석과
# src/asgard/craft_rules.py 의 `BRANCH_BUDGET` 주석에 있다. 셋 다 결함 문턱이 아니라 관례이므로
# 저장소가 바꿀 수 있어야 하고, 자리는 위 기준선과 같은 이유로 여기다 — **추적되는 파일이라
# 게이트를 푸는 행위가 diff 에 남는다**. 지운 줄은 기본값으로 돌아간다 (`health.budgets`).
[tool.asgard.craft-budget]
unit_lines = 70  # 함수 행 수
depth = 4  # 함수 내부 중첩
branches = 15  # 결정점 (순환복잡도 - 1)

# 부하 회귀 게이트(`asgard k6 gate`)가 회귀라고 부르기 전에 봐주는 폭. 기준선 **수치**는
# 기계마다 다르므로 `.asgard/k6/baseline.json` 에 두지만, **정책**인 이 오차는 기계와 무관하니
# 추적되는 파일에 둔다 — 그래야 게이트를 푸는 일이 diff 에 남는다.
#
# 값은 짐작이 아니라 실측이다. 같은 코드를 반복 실행해 잰 재현 편차가 평평한 표적에서
# 0.23~0.38%, 대기열이 생기는 표적에서 p95 9.25%(중앙값 1.71%)였다. 20%/10% 는 그 위에
# 순서통계량 오차를 얹은 상한이지 목표가 아니다.
#
# 단위가 축마다 다른 것이 요점이다: p95 와 처리량은 비율(%), 실패율은 **퍼센트포인트**다 —
# 건강한 기준선의 failed_rate 는 0.0 이고 0 의 20% 는 0 이라, 비율로 걸면 전송 실패 한 건이
# 곧바로 회귀가 된다. 알려진 한계: n=10,000 짜리 실행을 상시로 도는 저장소에서 1.0pp 는
# 실패 100건이므로 그런 곳은 이 값을 좁혀야 한다.
[tool.asgard.k6-gate]
p95_pct = 20.0
failed_rate_pp = 1.0
rate_per_s_pct = 10.0

# 타입체크 — ty 베타 채택, 문제 시 mypy 폴백. ref/·workspace/ 는 .gitignore 로 자동 제외.
[tool.ty.environment]
python-version = "3.14"
# 스킬 스크립트는 런타임에 sys.path 로 주입돼 임포트된다 (tests/test_office.py 참조).
# 검사기에도 같은 경로를 알려야 그 테스트가 미지의 모듈 더미가 되지 않는다 — 아래 src.exclude 가
# 그 파일들 자체는 검사 대상에서 빼므로, 여기서 늘어나는 것은 **해석 경로**뿐이다.
# 훅은 옆에 깔리는 `asgard_hooklib` 을 맨이름으로 임포트하고, 스크립트로 돌 때 `sys.path[0]` 이
# 이미 그 폴더다 (훅마다 `_HOOK_DIR` 를 다시 넣는 세 줄도 같은 이유). 검사기에 그 경로를 안 알리면
# 배포 계약대로 쓴 임포트가 전부 unresolved-import 로 잡힌다 — 26-08-06 에 그 상태로 52건이었다.
extra-paths = [
    "src/asgard/assets/skill_plugins/asgard-office/skills/asgard-office/scripts",
    "src/asgard/hooks",
]

[tool.ty.src]
exclude = [
    "src/asgard/assets/skill_plugins/**",  # vendored resource snapshots retain upstream bytes
    "archive/**",  # 보존용 원문 스냅샷 — 타입체크 대상 아님
    # Tauri 셸(Rust)의 자리. 여기 있는 하나뿐인 파이썬은 아이콘을 굽는 일회성 도구이고,
    # `uv run --no-project --with pillow` 로 **프로젝트 환경 밖에서** 돈다. 그 의존은 프로젝트
    # 의존이 아니므로 이 환경 기준으로 재면 있지도 않은 결함이 나온다.
    "studio-shell/**",
    # 호스트 스캐폴드는 `src/asgard/hooks` 의 **배포 사본**이다. 정본은 위 extra-paths 로 이미
    # 검사받고, 사본을 또 재면 같은 코드를 두 번 재면서 결함은 하나도 더 못 찾는다. 게다가 점으로
    # 시작하는 디렉터리는 패키지 뿌리로 안 잡혀서 `from .paths import …` 가 전부 unresolved 로
    # 떨어진다 — 26-08-17 에 그 상태로 36건이었고 릴리즈의 quality 잡이 거기서 멈췄다.
    ".codex/**",
    ".claude/**",
    ".cursor/**",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version — hardcoded in __init__ (frozen-safe; no importlib.metadata).
[tool.hatch.version]
path = "src/asgard/__init__.py"

[tool.hatch.build.targets.sdist.force-include]
"src/asgard/assets/skill_plugins/freyja-design/skills/asgard-freyja-design/references/vanadis/.claude" = "src/asgard/assets/skill_plugins/freyja-design/skills/asgard-freyja-design/references/vanadis/.claude"
"src/asgard/assets/skill_plugins/freyja-design/skills/asgard-freyja-design/references/vanadis/web/scripts/lib" = "src/asgard/assets/skill_plugins/freyja-design/skills/asgard-freyja-design/references/vanadis/web/scripts/lib"
"src/asgard/assets/skill_plugins/freyja-design/skills/asgard-freyja-design/references/vanadis/web/src/lib" = "src/asgard/assets/skill_plugins/freyja-design/skills/asgard-freyja-design/references/vanadis/web/src/lib"

[tool.hatch.build.targets.wheel]
packages = ["src/asgard"]
exclude = ["**/__pycache__/**", "**/*.pyc"]
artifacts = [
  "src/asgard/assets/*.png",
  "src/asgard/assets/*.html",
  "src/asgard/assets/container_kit/**",  # cross-platform Docker/Podman runtime
  "src/asgard/assets/sandbox_kit/**",  # Docker Sandboxes custom-agent kit
  "src/asgard/assets/k6_kit/**",  # asgard-k6 — 부하 시나리오·시나리오 라이브러리·기준 표적(pacer)
  "src/asgard/assets/skill_plugins/**",  # 내장 리소스 스킬 (예: ui-ux-pro-max)
  "src/asgard/assets/skill_plugins/freyja-design/**/.claude/**",
  "src/asgard/assets/skill_plugins/freyja-design/**/web/scripts/lib/**",
  "src/asgard/assets/skill_plugins/freyja-design/**/web/src/lib/**",
]  # 로고 lockup + local app HTML + built-in resources, 기본 .py-only 를 덮어 포함
