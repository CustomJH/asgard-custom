name: ci

# 26-07-23 에 push/PR CI 를 통째로 껐다(ci.yml.disabled). 26-08-02 에 **quality 잡 하나만**
# 되살린 것이 이 파일이다.
#
# 왜 되살렸는가: 끈 뒤로 검증 지점이 태그 하나뿐이 되었다 — release.yml 주석이 스스로 그렇게
# 적어 뒀다. 그래서 타입 진단 98건이 릴리스 태그를 밀 때까지 아무 데서도 안 보였고, 태그를
# 미는 자리에서 처음 빨개졌다. 막는 자리가 고치기 가장 비싼 자리였다.
#
# 왜 전면 부활이 아닌가: 껐던 사유("검증 잡음")를 우리가 다시 판정할 근거가 없으므로, 잡음의
# 출처였을 가능성이 가장 큰 세 잡은 그대로 둔다 — smoke(ubuntu+macos 매트릭스)·
# windows-terminal·studio-shell-windows 는 러너 3종과 npm·cargo 툴체인에 물려 있어 실패가
# 우리 코드 밖에서 나기 쉽다. 여기 남긴 넷은 전부 로컬 베이스라인과 **같은 커맨드**이고
# 결정론이다: 같은 트리에서 같은 결과가 나오지 않으면 그것 자체가 결함이다.
#
# 나머지 세 잡의 원문은 ci.yml.disabled 에 그대로 있다. 되살릴 때 이 주석과 같이 읽어라.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - run: uv sync --group dev

      - run: uv run ruff check

      - run: uv run ruff format --check

      - run: uv run ty check

      # 되돌리는 비용이 지수로 커지는 두 축(>1000행 파일 수·import 순환)이 pyproject.toml
      # [tool.asgard.health-gate] 기준선을 넘었는지. 나머지 여섯 지표는 여전히 관측만 한다 —
      # 왜 둘만 막는지는 src/asgard/health.py 의 GATE_METRICS 주석에 있다.
      - run: uv run asgard health --gate

      # -n auto: 직렬 실측 898초(14분 58초)짜리 스위트다. 러너 코어 수만큼 갈라 붙인다.
      # 밀폐 픽스처는 프로세스 단위라 워커 격리가 이미 서 있다 (tests/conftest.py).
      - run: uv run pytest -q -n auto

  # quality 는 tests/test_k6.py 를 수집하지만 ASGARD_K6_DOCKER 가 없어 실엔진 검증은 skip 한다.
  # 이 잡은 같은 로컬 명령으로 truth·gate·saturate 판을 실제 엔진에 걸어 하네스 정합성을 막는다.
  # 로컬 실측은 3.90초(0.07분)다. 10분 제한은 콜드 의존성 설치와 이미지 pull 여유를 포함한다.
  k6-selftest:
    name: k6 harness selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - run: uv sync --group dev

      # ubuntu-latest 의 Docker 클라이언트와 데몬이 실제로 응답하는지 실행 로그에 남긴다.
      - run: docker version

      - run: ASGARD_K6_DOCKER=1 uv run pytest tests/test_k6.py -q

      # `asgard k6 gate`(기준선 대비 성능 회귀)는 여기 **일부러 안 넣었다**.
      #
      # 두 가지가 겹쳐서다. 기준선은 `.asgard/k6/baseline.json` 이고 그 경로는 gitignore 라
      # CI 체크아웃에는 애초에 없다 — 넣으면 매 실행 "기준선이 없어요"로 종료 코드 0 을 내는
      # 장식 스텝이 된다. 설령 기준선을 커밋한다 해도 게이트가 먼저 보는 비교 가능성 축
      # (러너·k6 판·표적·vus_max)이 호스티드 러너에서 매번 달라 "견줄 수 없어요"로 나간다.
      # 그 둘은 게이트의 결함이 아니라 정확한 거절이다: 다른 기계에서 잰 p95 를 견주는 것은
      # 비교가 아니다.
      #
      # 그래서 이 잡이 막는 것은 **하네스가 참을 말하는가**(기계와 무관하고 pacer 로 결정론이다)
      # 이고, 성능 회귀는 표적과 기준선이 있는 자리 — 로컬이나 전용 러너 — 에서 `asgard k6 gate`
      # 로 건다. 여기에 옮겨 붙이려면 그 전에 위 두 조건을 먼저 풀어야 한다.
