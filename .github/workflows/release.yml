name: release

# Tag a release: git tag vX.Y.Z && git push origin vX.Y.Z
# Pure-python, so no compile matrix. Build a wheel + sdist with uv and attach them to the GitHub
# Release. install.sh installs the release wheel from here by default (no git or compiler on the
# host) — the tag itself is what `asgard upgrade` pins.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 태그 ↔ __version__ 불일치 방어 — 불일치면 wheel 파일명이 태그와 어긋나
  # install.sh 의 releases/download/v{tag}/asgard-{tag}-*.whl URL 이 404 가 된다.
  # 품질 게이트보다 앞에 둔다: 초 단위로 끝나는 검사를 8분짜리 뒤에 세울 이유가 없다.
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches __version__
        run: |
          v="$(sed -n 's/.*__version__ = "\([^"]*\)".*/\1/p' src/asgard/__init__.py)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != __version__ $v — src/asgard/__init__.py 를 먼저 올리세요"; exit 1; }

  # push/PR CI 는 꺼져 있다(ci.yml.disabled) — 그래서 태그가 **유일한** 검증 지점이다. 게이트를
  # 안 걸면 lint·타입·테스트를 한 번도 안 돌린 wheel 이 install.sh 로 나간다. 로컬 베이스라인과
  # 같은 4단: ruff check · ruff format --check · ty check · pytest.
  quality:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - run: uv sync --group dev

      - run: uv run ruff check

      - run: uv run ruff format --check

      - run: uv run ty check

      - run: uv run pytest -q

  release:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build wheel + sdist
        run: uv build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  desktop-windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
        working-directory: desktop

      - run: cargo test
        working-directory: desktop/src-tauri

      - run: npm run bundle:windows
        working-directory: desktop

      - name: Attach Windows installer
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
