name: release

# Tag a release: git tag vX.Y.Z && git push origin vX.Y.Z
# Pure-python, so no compile matrix. Build a wheel + sdist with uv and attach them to the GitHub
# Release. install.sh installs the release wheel from here by default (no git or compiler on the
# host) — the tag itself is what `asgard upgrade` pins.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 태그 ↔ __version__ 불일치 방어 — 불일치면 wheel 파일명이 태그와 어긋나
  # install.sh 의 releases/download/v{tag}/asgard-{tag}-*.whl URL 이 404 가 된다.
  # 품질 게이트보다 앞에 둔다: 초 단위로 끝나는 검사를 8분짜리 뒤에 세울 이유가 없다.
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches __version__
        run: |
          v="$(sed -n 's/.*__version__ = "\([^"]*\)".*/\1/p' src/asgard/__init__.py)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != __version__ $v — src/asgard/__init__.py 를 먼저 올리세요"; exit 1; }

      # 버전을 드는 곳이 둘이다. 창(`studio-shell`)은 자기 매니페스트를 갖고, 그 값이 곧
      # `Asgard.Studio_<버전>_x64-setup.exe` 라는 파일 이름이 된다. 위 검사가 파이썬 쪽만 봐서
      # v0.10.18 릴리즈에 0.10.17 이름의 설치본이 붙어 나갔다 — 휠은 이름이 맞았으므로 어느
      # 잡도 빨개지지 않았고, 어긋남은 릴리즈 페이지를 사람이 볼 때까지 안 보였다.
      # 다섯 자리 전수 대조는 tests/test_release_gate.py 가 하고, 여기서는 빌드가 실제로 읽는
      # 자리 하나를 초 단위로 먼저 본다.
      - name: Verify the studio shell ships the same version
        run: |
          s="$(jq -r .version studio-shell/src-tauri/tauri.conf.json)"
          [ "v$s" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != studio-shell $s — studio-shell 의 버전 다섯 자리를 먼저 올리세요 (package.json · package-lock.json · tauri.conf.json · Cargo.toml · Cargo.lock)"; exit 1; }

  # 26-08-02 부터 push/PR 에도 같은 quality 잡이 돈다(ci.yml) — 태그는 더 이상 유일한 검증
  # 지점이 아니다. 그래도 여기서 한 번 더 도는 이유는 태그가 **wheel 이 나가는** 자리이기
  # 때문이다: 브랜치 보호를 우회한 push, 체크 없이 민 태그, ci.yml 자체의 고장 — 어느 쪽이든
  # 여기서 걸린다. 로컬 베이스라인과 같은 4단 + health 게이트:
  # ruff check · ruff format --check · ty check · health --gate · pytest.
  quality:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - run: uv sync --group dev

      - run: uv run ruff check

      - run: uv run ruff format --check

      - run: uv run ty check

      # 릴리스마다 나빠지던 축을 여기서 막는다 — 실측(26-08-02 감사)에서 직전 릴리스 대비
      # 심각(>1000행) 7→9 로 오른 채 릴리스가 통과했다. 기준선은 pyproject.toml 에 있다.
      - run: uv run asgard health --gate

      # -n auto: 직렬 실측 898초. 태그 파이프라인은 사람이 기다리는 자리라 병렬로 돈다.
      - run: uv run pytest -q -n auto

  release:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build wheel + sdist
        run: uv build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  studio-shell-windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio-shell/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
        working-directory: studio-shell

      - run: cargo test
        working-directory: studio-shell/src-tauri

      - run: npm run bundle:windows
        working-directory: studio-shell

      - name: Attach Windows installer
        uses: softprops/action-gh-release@v2
        with:
          files: studio-shell/src-tauri/target/release/bundle/nsis/*-setup.exe
